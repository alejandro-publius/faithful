name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the documented floor; 3.12 is the development version.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # ruff is pinned: CI installs from PyPI, and an unpinned linter turns
        # every upstream release into a red build on untouched code.
        run: pip install pytest 'ruff==0.16.2'
      - name: Lint
        # `ruff format --check` is deliberately not gated: the repo predates the
        # formatter and a blanket reformat would bury real changes. Lint rules
        # (including import order and unused names) are enforced.
        run: ruff check faithful/ tests/ examples/
      - name: Test
        run: pytest tests/ -q
      - name: Example runs end to end
        # The bundled example is the quickstart; if it breaks, the README lies.
        run: python examples/run_example.py
