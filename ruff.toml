# Pin the rule set explicitly rather than inheriting whatever the installed
# ruff version happens to default to. CI installs ruff from PyPI, so without
# this a new ruff release silently widens the rules and breaks a build that
# touched none of the code — which is exactly what happened on 0.16.2.
line-length = 100

[lint]
# ruff's classic default (pycodestyle errors + pyflakes), plus import sorting,
# plus E402 so the deliberate "import after sys.path setup" noqa directives in
# examples/ are load-bearing rather than dead.
select = ["E4", "E7", "E9", "F", "I", "E402"]
